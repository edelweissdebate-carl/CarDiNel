name: Offline validation checks

on:
  pull_request:
  push:
    branches: [codex/prospective-capture]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install analysis and test dependencies
        run: python -m pip install sgp4 requests python-dotenv numpy astropy matplotlib boto3 PySide6
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Check command entry points
        run: |
          python -m src.defense --help
          python -m src.core.prospective_capture --help
          python -m src.core.prospective_validation --help
          python -m src.core.historical_validation --help
          python -m src.io.download_precise_orbits --help
      - name: Check Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: Launch_Defense.cmd --help
      - name: Check Python syntax
        run: python -m compileall -q src tests scripts
