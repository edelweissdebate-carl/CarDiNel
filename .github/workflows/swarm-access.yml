name: Public Swarm reference access
on:
  workflow_dispatch:
  push:
    branches: [codex/prospective-capture]
    paths:
      - scripts/check_swarm_reference.py
      - src/io/swarm_orbits.py
      - .github/workflows/swarm-access.yml
permissions:
  contents: read
jobs:
  public-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install requests sgp4 numpy astropy
      - run: python -u -m scripts.check_swarm_reference
